<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Expense Tracker</title>

    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <section id="login" class="login-container">
        <div class="login-card"> 
            <h1 class="logo">Expense Tracker</h1>
            <h2 class="login-title">Welcome Back!</h2>
            <p class="login-description">Sign in to continue managing your personal finances.</p>
        
            <form class="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="email" name="email" placeholder="Enter your email address" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="password" placeholder="Enter your password" required>
                </div>
                <div class="forgot-password">
                    <a href="forgotpassword.html">Forgot Password?</a>
                </div>
                <button type="submit">Login</button>
                <div class="signup-link">
                    <p>
                    Don't have an account?
                    <a href="signup.html">Sign Up</a>
                    </p>
                </div>
            </form>
        </div>
    </section>


</body>
</html>
